services:
  ctyun-manager:
    image: ${CTYUN_MANAGER_IMAGE:-ghcr.io/dayou0168/ctyun-manager:latest}
    container_name: ctyun-manager
    restart: unless-stopped
    environment:
      CTYUN_MANAGER_ADMIN_USER: ${CTYUN_MANAGER_ADMIN_USER:-admin}
      CTYUN_MANAGER_ADMIN_PASSWORD: ${CTYUN_MANAGER_ADMIN_PASSWORD:-change-me-now}
      CTYUN_MANAGER_DB: /app/data/ctyun-manager.db
      CTYUN_MANAGER_CTYUN_MODE: ${CTYUN_MANAGER_CTYUN_MODE:-openapi}
      CTYUN_MANAGER_SESSION_SECRET: ${CTYUN_MANAGER_SESSION_SECRET:-change-this-session-secret}
      CTYUN_MANAGER_PUBLIC_URL: ${CTYUN_MANAGER_PUBLIC_URL:-http://127.0.0.1:8000}
      CTYUN_BACKGROUND_SYNC_SECONDS: ${CTYUN_BACKGROUND_SYNC_SECONDS:-300}
      CTYUN_FINANCE_REFRESH_SECONDS: ${CTYUN_FINANCE_REFRESH_SECONDS:-300}
      CTYUN_BROWSER_PAGE_REFRESH_SECONDS: ${CTYUN_BROWSER_PAGE_REFRESH_SECONDS:-600}
      CTYUN_BROWSER_HEADFUL: ${CTYUN_BROWSER_HEADFUL:-1}
      CTYUN_RECHARGE_PREWARM_ENABLED: ${CTYUN_RECHARGE_PREWARM_ENABLED:-1}
      CTYUN_RECHARGE_FAST_ORDER_ENABLED: ${CTYUN_RECHARGE_FAST_ORDER_ENABLED:-1}
      CTYUN_RECHARGE_QR_CACHE_ENABLED: ${CTYUN_RECHARGE_QR_CACHE_ENABLED:-1}
      CTYUN_OPENAPI_WORKERS: ${CTYUN_OPENAPI_WORKERS:-6}
      CTYUN_OPENAPI_TIMEOUT_SECONDS: ${CTYUN_OPENAPI_TIMEOUT_SECONDS:-20}
      PLAYWRIGHT_BROWSERS_PATH: /app/.playwright
      HOME: /app/data/home
      DISPLAY: :99
      CTYUN_MANAGER_PORT: 8000
    ports:
      - "${CTYUN_MANAGER_PORT:-8000}:8000"
    volumes:
      - ctyun-manager-data:/app/data
    shm_size: "1gb"

volumes:
  ctyun-manager-data:
