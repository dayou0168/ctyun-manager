services:
  ctyun-manager:
    image: ${CTYUN_MANAGER_IMAGE:-ghcr.io/dayou0168/ctyun-manager:latest}
    container_name: ctyun-manager
    restart: unless-stopped
    environment:
      CTYUN_MANAGER_DB: /app/data/ctyun-manager.db
      CTYUN_MANAGER_MASTER_KEY_FILE: /app/data/master.key
      CTYUN_MANAGER_GO_HOST: 0.0.0.0
      CTYUN_MANAGER_GO_PORT: 8000
      CTYUN_MANAGER_DB_READ_ONLY: "0"
      CTYUN_MANAGER_CTYUN_MODE: ${CTYUN_MANAGER_CTYUN_MODE:-openapi}
      CTYUN_MANAGER_SESSION_SECRET: ${CTYUN_MANAGER_SESSION_SECRET:?set CTYUN_MANAGER_SESSION_SECRET in .env}
      CTYUN_MANAGER_PUBLIC_URL: ${CTYUN_MANAGER_PUBLIC_URL:-http://127.0.0.1:8000}
      CTYUN_BACKGROUND_SYNC_ENABLED: ${CTYUN_BACKGROUND_SYNC_ENABLED:-0}
      CTYUN_BACKGROUND_SYNC_SECONDS: ${CTYUN_BACKGROUND_SYNC_SECONDS:-1800}
      CTYUN_FINANCE_REFRESH_ENABLED: ${CTYUN_FINANCE_REFRESH_ENABLED:-1}
      CTYUN_FINANCE_REFRESH_SECONDS: ${CTYUN_FINANCE_REFRESH_SECONDS:-1800}
      CTYUN_FINANCE_REFRESH_WORKERS: ${CTYUN_FINANCE_REFRESH_WORKERS:-2}
      CTYUN_COOKIE_KEEPALIVE_ENABLED: ${CTYUN_COOKIE_KEEPALIVE_ENABLED:-1}
      CTYUN_COOKIE_KEEPALIVE_SECONDS: ${CTYUN_COOKIE_KEEPALIVE_SECONDS:-3600}
      CTYUN_COOKIE_KEEPALIVE_WORKERS: ${CTYUN_COOKIE_KEEPALIVE_WORKERS:-2}
      CTYUN_BROWSER_PAGE_REFRESH_SECONDS: ${CTYUN_BROWSER_PAGE_REFRESH_SECONDS:-600}
      CTYUN_BROWSER_SESSION_IDLE_SECONDS: ${CTYUN_BROWSER_SESSION_IDLE_SECONDS:-600}
      CTYUN_BROWSER_SESSION_CLEANUP_SECONDS: ${CTYUN_BROWSER_SESSION_CLEANUP_SECONDS:-120}
      CTYUN_BROWSER_HEADLESS: ${CTYUN_BROWSER_HEADLESS:-1}
      CTYUN_RECHARGE_PREWARM_ENABLED: ${CTYUN_RECHARGE_PREWARM_ENABLED:-0}
      CTYUN_RECHARGE_FAST_ORDER_ENABLED: ${CTYUN_RECHARGE_FAST_ORDER_ENABLED:-1}
      CTYUN_RECHARGE_QR_CACHE_ENABLED: ${CTYUN_RECHARGE_QR_CACHE_ENABLED:-1}
      CTYUN_OPENAPI_WORKERS: ${CTYUN_OPENAPI_WORKERS:-6}
      CTYUN_OPENAPI_TIMEOUT_SECONDS: ${CTYUN_OPENAPI_TIMEOUT_SECONDS:-20}
      HOME: /app/data/home
    ports:
      - "${CTYUN_MANAGER_PORT:-8000}:8000"
    volumes:
      - ${CTYUN_MANAGER_DATA_DIR:-./data}:/app/data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
