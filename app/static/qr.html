<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>充值收款码</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#f4f6f8;font-family:Inter,"Microsoft YaHei",Arial,sans-serif;color:#17202a}
    main{height:100%;display:grid;place-items:center;padding:20px}
    section{text-align:center}
    h2{margin:0 0 10px;font-size:20px;font-weight:650;letter-spacing:0}
    .payment-amount{display:inline-flex;align-items:baseline;gap:6px;margin:0 0 12px;padding:6px 14px;border:1px solid #f3c7c2;border-radius:999px;background:#fff7f6;color:#b42318;font-size:20px;font-weight:750;box-shadow:0 6px 20px #b4231812}
    .payment-amount[hidden]{display:none}
    .payment-amount small{font-size:12px;font-weight:650;color:#7a2a23}
    img{display:block;width:min(360px,72vw,72vh);height:auto;image-rendering:auto;background:#fff;border:12px solid #fff;box-shadow:0 10px 35px #0002}
    p{margin:14px 0 0;font-size:14px;color:#5f6b76}
    .qr-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    button{margin-top:12px;border:1px solid #cbd2d9;border-radius:5px;background:#fff;padding:9px 14px;color:#26313b;cursor:pointer}
    #closeQrBtn{border-color:#efb4ad;color:#b42318}
    button:disabled{cursor:not-allowed;opacity:.55}
  </style>
</head>
<body>
  <main><section><h2 id="paymentMethodTitle">扫码支付</h2><div id="paymentAmount" class="payment-amount" hidden></div><img id="qrImage" alt="充值收款码"><p id="qrStatus">正在加载收款码...</p><div class="qr-actions"><button id="refreshQrBtn" type="button" disabled>刷新二维码</button><button id="closeQrBtn" type="button">取消充值</button></div></section></main>
  <script src="/static/qr.js?v=20260623-0044"></script>
</body>
</html>
