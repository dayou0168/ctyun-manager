<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支付状态</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#f4f6f8;font-family:Inter,"Microsoft YaHei",Arial,sans-serif;color:#26313b}
    main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid #d7dde3;border-top-color:#d92d2d;border-radius:50%;animation:spin .8s linear infinite}
    .error .spinner,.success .spinner{display:none}
    .error .mark,.success .mark{display:grid}
    .mark{display:none;width:38px;height:38px;margin:0 auto 16px;place-items:center;border:2px solid #d92d2d;border-radius:50%;color:#d92d2d;font-size:24px}
    .success .mark{border-color:#18794e;color:#18794e}
    p{max-width:420px;margin:0;color:#5f6b76;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main>
    <section id="statusBox">
      <div class="spinner"></div>
      <div class="mark" id="statusMark">!</div>
      <p id="statusText">正在生成收款码...</p>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const box = document.querySelector("#statusBox");
    if (params.get("mode") === "error") box.classList.add("error");
    if (params.get("mode") === "success") {
      box.classList.add("success");
      document.querySelector("#statusMark").textContent = "✓";
    }
    document.querySelector("#statusText").textContent = params.get("message") || "正在生成收款码...";
  </script>
</body>
</html>
